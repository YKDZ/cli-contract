name: 发布 npm 包

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  pack:
    name: 验收并打包
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 读取 Node 版本
        id: node-runtime
        run: echo "runtime=node@$(jq -er '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
      - name: 安装 pnpm 与 Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: ${{ steps.node-runtime.outputs.runtime }}
          install: false
          cache: true
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 检查源码
        run: pnpm run check
      - name: 按依赖顺序构建
        run: pnpm exec turbo run build
      - name: 打包未发布版本
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: 下载同批制品进行消费验收
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/changesets-pack
      - name: 验收 Changesets 原生制品
        run: pnpm product:verify -- --pack-dir "$RUNNER_TEMP/changesets-pack"

  publish:
    name: 发布 npm 包和 GitHub Release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 读取 Node 版本
        id: node-runtime
        run: echo "runtime=node@$(jq -er '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
      - name: 安装 pnpm 与 Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: ${{ steps.node-runtime.outputs.runtime }}
          install: false
          cache: false
      - name: 安装依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 发布已验收制品
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
          push-git-tags: true
