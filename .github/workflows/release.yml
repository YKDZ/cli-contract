name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout event commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release tag and package versions
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: node --conditions=source scripts/validate-release-tag.ts "$RELEASE_REF" "$EVENT_SHA"
      - name: Install supported npm
        run: npm install --global npm@11.5.1
      - name: Show npm version
        run: npm --version
      - name: Verify release candidate
        id: candidate
        shell: bash
        run: |
          candidate_directory="$(mktemp -d)"
          candidate_result="$(pnpm --silent candidate:verify -- --output-dir "$candidate_directory")"
          core_tarball="$(jq --raw-output '.coreTarball' <<<"$candidate_result")"
          testing_tarball="$(jq --raw-output '.testingTarball' <<<"$candidate_result")"
          test -f "$core_tarball"
          test -f "$testing_tarball"
          printf 'core_tarball=%s\n' "$core_tarball" >> "$GITHUB_OUTPUT"
          printf 'testing_tarball=%s\n' "$testing_tarball" >> "$GITHUB_OUTPUT"
      - name: Publish core package
        env:
          CORE_TARBALL: ${{ steps.candidate.outputs.core_tarball }}
        run: npm publish "$CORE_TARBALL" --access public --tag latest --registry https://registry.npmjs.org
      - name: Publish testing package
        env:
          TESTING_TARBALL: ${{ steps.candidate.outputs.testing_tarball }}
        run: npm publish "$TESTING_TARBALL" --access public --tag latest --registry https://registry.npmjs.org
      - name: Create GitHub Release
        env:
          CORE_TARBALL: ${{ steps.candidate.outputs.core_tarball }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TESTING_TARBALL: ${{ steps.candidate.outputs.testing_tarball }}
        run: gh release create "$RELEASE_TAG" "$CORE_TARBALL" "$TESTING_TARBALL" --verify-tag
